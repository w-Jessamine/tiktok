services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: videopilot
      POSTGRES_PASSWORD: videopilot
      POSTGRES_DB: videopilot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @videopilot/api dev"
    env_file: .env
    ports:
      - "4000:4000"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
      - minio
  worker:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache ffmpeg && corepack enable && pnpm install && pnpm --filter @videopilot/worker dev"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
      - minio
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @videopilot/web dev --host 0.0.0.0"
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    depends_on:
      - api
volumes:
  postgres-data:
  minio-data:
