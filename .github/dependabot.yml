version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    groups:
      tooling:
        patterns:
          - eslint*
          - prettier
          - typescript
          - vitest
          - "@typescript-eslint/*"
      react-stack:
        patterns:
          - react
          - react-dom
          - "@vitejs/*"
          - vite
      prisma:
        patterns:
          - prisma
          - "@prisma/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
