name: docker-build

on:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t videopilot-api:ci .
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t videopilot-worker:ci .
