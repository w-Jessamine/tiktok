services:
  - type: web
    name: videopilot-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: hybrid
      - key: ARK_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/v3
      - key: ARK_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: videopilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: videopilot-redis
          property: connectionString
  - type: worker
    name: videopilot-worker
    runtime: docker
    dockerfilePath: ./apps/worker/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: hybrid
      - key: ARK_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/v3
      - key: ARK_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: videopilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: videopilot-redis
          property: connectionString
  - type: web
    name: videopilot-web
    runtime: static
    buildCommand: corepack enable && pnpm install && pnpm --filter @videopilot/web build
    staticPublishPath: ./apps/web/dist
databases:
  - name: videopilot-db
    databaseName: videopilot
    user: videopilot
  - name: videopilot-redis
    plan: free
    type: redis
